<div>
    <div class="image_background fixed h-screen w-screen flex flex-col -z-10"></div>

    <div class="min-h-screen flex flex-col justify-center bg-black/50 z-10 pb-10 gap-5">
        <header class="w-full flex pt-3 pl-10">
            <h1 class="font-bold text-cyan-300 text-3xl">DemoFlix</h1>
        </header> 

        <main class="flex-1 flex flex-col h-full justify-center items-center pl-5 pr-5">
            @switch (cardsVisibilit()) {
            @case ('login') {
            <app-card-login-component class="w-full" (dataFormLogin)="sendLogin($event)" (clickForgotPasswordEvent)="changeActiveCard('recoverEmail')"
                (clickCreateLoginEvent)="changeActiveCard('createLogin')"></app-card-login-component>
            }
            @case ('createLogin') {
            <app-card-created-account-component class="w-full"
                (clickLoginEvent)="changeActiveCard('login')"></app-card-created-account-component>
            }
            @case ('newPassword') {
            <app-card-new-password-component class="w-full"
                (clickLoginEvent)="changeActiveCard('login')"></app-card-new-password-component>
            }
            @case ('recoverEmail') {
            <app-card-recover-email-password-component class="w-full"
                (clickEvent)="changeActiveCard('login')"></app-card-recover-email-password-component>
            }
            @case ('verificationCode') {
            <app-card-verification-code-component
                (clickLoginEvent)="changeActiveCard('login')"></app-card-verification-code-component>
            }
            @case ('loadingCard') {
                <app-card-loading-component></app-card-loading-component>
            }
            }

            <app-floating-information-message-component class="hidden"></app-floating-information-message-component>
        </main>
    </div>
</div>
