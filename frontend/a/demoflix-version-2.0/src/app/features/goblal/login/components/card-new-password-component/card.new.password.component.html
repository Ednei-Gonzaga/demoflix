<form [formGroup]="formNewPassword" (ngSubmit)="onSubmit()"
 animate.enter="animate__animated animate__fadeIn" animate.leave="animate__animated animate__fadeOut"
    class="bg_color_card mx-auto flex flex-col justify-center min-h-80 max-w-md w-full pl-8 pr-8 pb-10 pt-10  rounded-2xl">
    <app-title-cards-page-login-component titleCard="nova senha"
        descriptionCard="Crie uma nova senha para sua conta"></app-title-cards-page-login-component>

    <div class="flex flex-col w-full gap-3 mt-3">
        @for(data of dataInputLogin; track $index){
        <app-input-login-component-ts [receiveDataInput]="data" [maxLength]="$index == 0 ? '6':'99999'"></app-input-login-component-ts>
        @if($index == 1){
            <div>
                <p class="text-gray-400/80 text-sm transition-all duration-100" [ngClass]="formNewPassword.get('senha')?.valid ? 'text-green-300/90':'text-red-500/80'">Senha deve conter 8-16 digitos.</p>
                <p class="text-gray-400/80 text-sm transition-all duration-100" [ngClass]="formNewPassword.get('senha')?.valid ? 'text-green-300/90':'text-red-500/80'">Senha deve ter uma letra maiúscula.</p>
            </div>
        }
        }
    </div>

    <div class="mt-5 text-center flex flex-col gap-2 w-full">
        <app-button-login-submit-component titleButton="redefinir senha" [isEnable]="formNewPassword.invalid"></app-button-login-submit-component>
        <app-login-auth-link-component textButton="Voltar Login" questionText="Não que mais trocar?"
            (clickEvent)="onClickLoginEvent()"></app-login-auth-link-component>
    </div>

</form>
