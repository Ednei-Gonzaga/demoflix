<form [formGroup]="verificationForm" (ngSubmit)="onSubmit()"
    class="bg_color_card mx-auto flex flex-col justify-center min-h-80 max-w-md w-full pl-8 pr-8 pb-10 pt-10  rounded-2xl"
    animate.enter = "animate__animated animate__fadeIn" animate.leave = "animate__animated animate__fadeOut">
    <app-title-cards-page-login-component titleCard="Verificar Código"
        descriptionCard="Enviamos um codigo de 6 digitos para seu email"></app-title-cards-page-login-component>

    <app-input-login-component-ts [receiveDataInput]="dataInputLogin" maxLength="6"></app-input-login-component-ts>

    <div  class="mt-5 text-center flex flex-col gap-2 w-full">
        <app-button-login-submit-component [isEnable]="!verificationForm.valid" titleButton="Verificar e Continuar"></app-button-login-submit-component>
        <app-login-auth-link-component textButton="Cancelar e voltar para login" (clickEvent)="onClickLoginEvent()"></app-login-auth-link-component>
    </div>

</form>
